<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Celebration | Just Celebrate</title><meta name="theme-color" content="#103f39"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="share-upgrade.css"></head><body class="shared-page"><header class="shared-header"><a href="/" class="brand"><span>Just</span>Celebrate<span class="brand-dot">.</span></a><a href="/celebration-planner/index.html?fresh=1" class="shared-plan-own">Plan your own celebration →</a></header><main id="shared-celebration"></main><script>(()=>{const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),cats={venue:'Venue',music:'DJ & music',photography:'Photography',catering:'Catering',cake:'Cake & treats',decor:'Decor & balloons',entertainment:'Entertainment',transport:'Transport'};function date(v){if(!v)return'Date to be confirmed';try{return new Date(v+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}catch{return v}}try{let raw=new URLSearchParams(location.search).get('p')||'';raw=raw.replace(/-/g,'+').replace(/_/g,'/');while(raw.length%4)raw+='=';const p=JSON.parse(decodeURIComponent(escape(atob(raw)))),groups={};(p.suppliers||[]).forEach(s=>(groups[s.category]??=[]).push(s));document.querySelector('#shared-celebration').innerHTML=`<section class="shared-hero"><p>YOU'RE INVITED TO VIEW</p><h1>${esc(p.name)}</h1><div></div><strong>${esc(date(p.date))}</strong><span>${esc(p.location||'Location to be confirmed')}${p.guests?' · '+esc(p.guests)+' guests':''}</span></section><section class="shared-intro">✦ <span>Everything for this celebration, beautifully coming together.</span></section><section class="shared-suppliers">${Object.entries(groups).map(([cat,ss])=>`<article><p>${esc(cats[cat]||cat)}</p>${ss.map(s=>`<h2>${esc(s.name)}</h2>${s.location?`<span>${esc(s.location)}</span>`:''}`).join('')}</article>`).join('')||'<article><h2>The celebration is coming together.</h2></article>'}</section><section class="shared-cta"><p>INSPIRED TO CELEBRATE?</p><h2>Make your own lovely plan.</h2><a href="/celebration-planner/index.html?fresh=1">Start planning with Just Celebrate →</a></section>`}catch{document.querySelector('#shared-celebration').innerHTML='<section class="shared-error"><h1>This celebration link is unavailable.</h1><a href="/celebration-planner/index.html?fresh=1">Plan a celebration →</a></section>'}})()</script></body></html>
